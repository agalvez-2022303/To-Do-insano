<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ To-Do Insano ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Partículas animadas de fondo */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.3) 0%, transparent 50%),
                repeating-linear-gradient(45deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 2px, transparent 2px, transparent 8px);
            pointer-events: none;
            animation: float 20s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(1deg); }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* Header insano */
        .header {
            text-align: center;
            margin-bottom: 50px;
            animation: glitch 3s infinite;
        }

        @keyframes glitch {
            0%, 100% { transform: skew(0deg, 0deg); }
            95% { transform: skew(0deg, 0deg); }
            96% { transform: skew(5deg, 2deg); }
            97% { transform: skew(-5deg, -2deg); }
            98% { transform: skew(3deg, 1deg); }
            99% { transform: skew(-3deg, -1deg); }
        }

        h1 {
            font-size: 5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, #ffe6f0 25%, #ffd6e8 50%, #ffe6f0 75%, #fff 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shine 3s linear infinite, bounce 2s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(255,255,255,0.5);
        }

        @keyframes shine {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        /* Grid de 2 columnas */
        .tasks-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            margin-top: 30px;
        }

        /* Tarjetas con efecto neón */
        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid rgba(255,255,255,0.2);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        .card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 30px 80px rgba(0,0,0,0.4);
        }

        .card h2 {
            font-size: 2rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pending-card h2 {
            color: #ff6b6b;
            text-shadow: 0 0 10px rgba(255,107,107,0.5);
        }

        .completed-card h2 {
            color: #51cf66;
            text-shadow: 0 0 10px rgba(81,207,102,0.5);
        }

        .badge {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-radius: 50px;
            padding: 5px 15px;
            font-size: 1rem;
            margin-left: 10px;
        }

        /* Formulario insano */
        .form-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(255,255,255,0.9));
            margin-bottom: 30px;
            border: 2px solid rgba(255,255,255,0.3);
        }

        .form-group {
            margin-bottom: 20px;
        }

        input, textarea {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s;
            background: white;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #764ba2;
            box-shadow: 0 0 20px rgba(118,75,162,0.3);
            transform: scale(1.02);
        }

        /* Botones insanos */
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Poppins', sans-serif;
            text-decoration: none;
            display: inline-block;
            margin: 5px;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102,126,234,0.6);
        }

        .btn-success {
            background: linear-gradient(135deg, #51cf66, #37b24d);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff6b6b, #f03e3e);
            color: white;
        }

        .btn-warning {
            background: linear-gradient(135deg, #ffd93d, #f59f00);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.05);
        }

        .btn:active {
            transform: translateY(1px);
        }

        /* Tareas individuales */
        .task-item {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s;
            border-left: 5px solid;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .task-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .pending-task {
            border-left-color: #ff6b6b;
        }

        .completed-task {
            border-left-color: #51cf66;
            opacity: 0.7;
        }

        .completed-task h3 {
            text-decoration: line-through;
            color: #999;
        }

        .task-item h3 {
            font-size: 1.3rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .task-item p {
            color: #666;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .task-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-sm {
            padding: 8px 20px;
            font-size: 0.9rem;
        }

        /* Botón flotante */
        .floating-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: all 0.3s;
            z-index: 1000;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .floating-btn:hover {
            transform: scale(1.1) rotate(90deg);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .tasks-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 2.5rem;
            }

            .card {
                padding: 20px;
            }
        }

        /* Scrollbar personalizada */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        ::-webkit-scrollbar-thumb {
            background: white;
            border-radius: 10px;
        }

        /* Confetti effect */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #f00;
            position: absolute;
            animation: confetti-fall 3s linear forwards;
        }

        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>
            <i class="fas fa-tasks"></i>
            TO-DO INSANO
            <i class="fas fa-skull"></i>
        </h1>
        <p style="color: white; font-size: 1.2rem; text-shadow: 0 2px 5px rgba(0,0,0,0.3);">
            <i class="fas fa-fire"></i> Organiza tu caos con estilo <i class="fas fa-fire"></i>
        </p>
    </div>

    <!-- Formulario INSANO -->
    <div class="card form-card">
        <h2 style="background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; background-clip: text; color: transparent;">
            <i class="fas fa-plus-circle"></i> CREA TAREAS ÉPICAS
        </h2>
        <form action="/tasks" method="post">
            <div class="form-group">
                <input type="text" name="title" placeholder="📝 Título de la tarea (obligatorio)" required/>
            </div>
            <div class="form-group">
                <textarea name="description" placeholder="📄 Descripción épica (opcional)" rows="3"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-rocket"></i> AGREGAR TAREA INSANA
            </button>
        </form>
    </div>

    <!-- Grid de tareas -->
    <div class="tasks-grid">
        <!-- Tareas Pendientes -->
        <div class="card pending-card">
            <h2>
                <i class="fas fa-clock"></i>
                PENDIENTES
                <span class="badge" th:text="${pendingTasks.size()}">0</span>
            </h2>
            <div th:if="${pendingTasks.empty}">
                <p style="text-align: center; color: #999; padding: 40px;">
                    <i class="fas fa-party-horn" style="font-size: 3rem;"></i><br/>
                    🎉 ¡No hay tareas pendientes! 🎉
                </p>
            </div>
            <div th:each="task : ${pendingTasks}">
                <div class="task-item pending-task">
                    <h3>
                        <i class="fas fa-exclamation-triangle" style="color: #ff6b6b;"></i>
                        <span th:text="${task.title}"></span>
                    </h3>
                    <p th:text="${task.description}" th:if="${task.description != null}">
                        <i class="fas fa-align-left"></i> <span th:text="${task.description}"></span>
                    </p>
                    <div class="task-actions">
                        <a th:href="@{'/tasks/' + ${task.id} + '/toggle'}" class="btn btn-success btn-sm">
                            <i class="fas fa-check"></i> Completar
                        </a>
                        <a th:href="@{'/tasks/' + ${task.id} + '/delete'}" class="btn btn-danger btn-sm" onclick="return confirm('¿Seguro que quieres eliminar esta tarea?')">
                            <i class="fas fa-trash"></i> Eliminar
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tareas Completadas -->
        <div class="card completed-card">
            <h2>
                <i class="fas fa-trophy"></i>
                COMPLETADAS
                <span class="badge" th:text="${completedTasks.size()}">0</span>
            </h2>
            <div th:if="${not completedTasks.empty}">
                <a href="/tasks/delete-completed" class="btn btn-danger btn-sm" style="margin-bottom: 20px;" onclick="return confirm('¿Eliminar TODAS las tareas completadas?')">
                    <i class="fas fa-bomb"></i> ELIMINAR TODAS
                </a>
            </div>
            <div th:if="${completedTasks.empty}">
                <p style="text-align: center; color: #999; padding: 40px;">
                    <i class="fas fa-inbox" style="font-size: 3rem;"></i><br/>
                    📭 Sin tareas completadas aún
                </p>
            </div>
            <div th:each="task : ${completedTasks}">
                <div class="task-item completed-task">
                    <h3>
                        <i class="fas fa-check-circle" style="color: #51cf66;"></i>
                        <span th:text="${task.title}"></span>
                    </h3>
                    <p th:text="${task.description}" th:if="${task.description != null}"></p>
                    <div class="task-actions">
                        <a th:href="@{'/tasks/' + ${task.id} + '/toggle'}" class="btn btn-warning btn-sm">
                            <i class="fas fa-undo"></i> Reabrir
                        </a>
                        <a th:href="@{'/tasks/' + ${task.id} + '/delete'}" class="btn btn-danger btn-sm" onclick="return confirm('¿Eliminar esta tarea?')">
                            <i class="fas fa-trash"></i> Eliminar
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Botón flotante loco -->
<div class="floating-btn" onclick="location.href='#top'">
    <i class="fas fa-arrow-up"></i>
</div>

<script>
    // Efecto de confeti al completar tarea
    function showConfetti() {
        for(let i = 0; i < 100; i++) {
            let confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.style.left = Math.random() * 100 + '%';
            confetti.style.background = `hsl(${Math.random() * 360}, 100%, 50%)`;
            confetti.style.animationDuration = Math.random() * 2 + 1 + 's';
            document.body.appendChild(confetti);
            setTimeout(() => confetti.remove(), 3000);
        }
    }

    // Detectar si venimos de completar una tarea
    if(window.location.href.includes('toggle')) {
        showConfetti();
    }

    // Animación de entrada para las tareas
    document.querySelectorAll('.task-item').forEach((item, index) => {
        item.style.animationDelay = index * 0.1 + 's';
    });
</script>
</body>
</html>
